cache-file: "/var/lib/ntfy/cache.db"
auth-file: "/var/lib/ntfy/auth.db"
auth-default-access: "deny-all"
behind-proxy: true
# Users (bcrypt hashes) and tokens are secrets: they come from NTFY_AUTH_USERS / NTFY_AUTH_TOKENS
# in rpizero2/.env, rendered by utils/firstboot/prepare_firstboot.py.
#   reader    — password login, for the phone app
#   publisher — token only, for Gatus and scripts (NTFY_PUBLISH_TOKEN)
auth-access:
  - "reader:*:ro"
  - "publisher:*:wo"
upstream-base-url: "https://ntfy.sh"
